interface:
  display_name: "Change Plan"
  short_description: "维护可审阅并在 Plan 内推进的 Change 计划"
  default_prompt: "使用 $change-plan 为明确 Change 创建或维护 proposal、design、tasks 与 metadata；先恢复项目 owner 和固定契约，按 draft -> plan -> complete-and-delete 生命周期工作，在 Plan 内推进 Readiness、Implementation 与 Verification，依据直接 Git 距离证据复核上下文；complete 前完成 owner 交接、语义审阅与授权，再把它们与机械结果分别交付。"
