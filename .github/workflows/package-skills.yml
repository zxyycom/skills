name: Package Skills

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      publish_snapshot:
        description: On main, create an immutable snapshot for the current package hash
        required: false
        default: false
        type: boolean
      accept_release_id:
        description: Release ID to accept in isolated Linux and Windows directories
        required: false
        type: string
      accept_revision:
        description: Exact published revision for the isolated release acceptance
        required: false
        type: string

concurrency:
  group: package-skills-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate online acceptance selection
        env:
          ACCEPT_RELEASE_ID: ${{ inputs.accept_release_id }}
          ACCEPT_REVISION: ${{ inputs.accept_revision }}
        shell: bash
        run: |
          set -euo pipefail
          if { [ -n "$ACCEPT_RELEASE_ID" ] && [ -z "$ACCEPT_REVISION" ]; } || { [ -z "$ACCEPT_RELEASE_ID" ] && [ -n "$ACCEPT_REVISION" ]; }; then
            echo "::error::accept_release_id and accept_revision must be supplied together"
            exit 1
          fi
          if [ -n "$ACCEPT_RELEASE_ID" ] && { [[ ! "$ACCEPT_RELEASE_ID" =~ ^[1-9][0-9]*$ ]] || [[ ! "$ACCEPT_REVISION" =~ ^([a-f0-9]{40}|[a-f0-9]{64})$ ]]; }; then
            echo "::error::acceptance requires a positive release ID and full lowercase revision"
            exit 1
          fi

  package:
    needs: validate-inputs
    runs-on: ubuntu-latest
    outputs:
      skill_hash: ${{ steps.skill_hash.outputs.current_hash }}
      tested_revision: ${{ steps.revision.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Record tested revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify event baseline
        env:
          BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASELINE_REF:-}" ] && [ "$BASELINE_REF" != "0000000000000000000000000000000000000000" ]; then
            if ! git cat-file -e "${BASELINE_REF}^{commit}" 2>/dev/null; then
              echo "::error title=Event baseline unavailable::Cannot resolve $BASELINE_REF after checkout. A force-push may have removed the event's before commit; use a manual workflow dispatch for the current snapshot instead of silently comparing against HEAD."
              exit 1
            fi
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: false

      - name: Install pinned Rust toolchain for source checks
        working-directory: tools/record-cli
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify project test-evidence prerequisites
        run: test "$(node_modules/.bin/ast-grep --version)" = "ast-grep 0.45.1"

      - name: Install metric prerequisites
        run: |
          set -euo pipefail
          go install github.com/boyter/scc/v4@v4.0.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify metric prerequisites
        run: |
          set -euo pipefail
          test "$(scc --version)" = "scc version 4.0.0"

      - name: Prepare and validate native repository runtime
        run: |
          cargo +1.98.1 fetch --manifest-path tools/record-cli/Cargo.toml --locked
          bun run prepare:record-native
          node scripts/prepare-record-native.ts --check

      - name: Validate and package
        env:
          BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          SKILL_RELEASE_STAGE: package-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          args=(--tag release --cold)
          if [ -n "${BASELINE_REF:-}" ] && [ "$BASELINE_REF" != "0000000000000000000000000000000000000000" ]; then
            args+=(--baseline-ref "$BASELINE_REF")
          fi
          bun run check -- "${args[@]}"

      - name: Calculate skill hash and check versions
        id: skill_hash
        env:
          BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          args=(--github-output)
          if [ -n "${BASELINE_REF:-}" ] && [ "$BASELINE_REF" != "0000000000000000000000000000000000000000" ]; then
            args+=(--baseline-ref "$BASELINE_REF")
          fi
          bun run hash:skills -- "${args[@]}"

      - name: Upload skill assets
        uses: actions/upload-artifact@v4
        with:
          name: skills
          path: dist/skill-release/package-${{ github.run_id }}-${{ github.run_attempt }}/packages/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload Gate failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: gate-diagnostics
          include-hidden-files: true
          path: |
            .log/vibe-check/invocations/*/machine/*.json
            .log/vibe-check/invocations/*/machine/*.ndjson
            .log/vibe-check/invocations/*/progress.log
            .log/vibe-check/invocations/*/checks/**/process.log
          if-no-files-found: ignore
          retention-days: 3

  native-build:
    needs: validate-inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: native-release-linux
          - os: windows-2022
            artifact: native-release-windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve source bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - run: pnpm install --frozen-lockfile
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Run native tests on this platform
        run: cargo +1.98.1 test --manifest-path tools/record-cli/Cargo.toml --locked --all-targets -- --include-ignored
      - name: Run native updater tests on this platform
        run: node --test scripts/lib/record-native/tests/runtime.test.ts tools/skill-updater/tests/native-archive.test.ts tools/skill-updater/tests/native-bundle.test.ts tools/skill-updater/tests/native-frozen-consumer.test.ts tools/skill-updater/tests/native-overlay.test.ts tools/skill-updater/tests/native-cli.test.ts tools/skill-updater/tests/native-manifest.test.ts tools/skill-updater/tests/native-release.test.ts tools/skill-updater/tests/native-updater-dependencies.test.ts
      - name: Build formal frozen inputs
        run: node scripts/lib/record-native/ci-release-build.ts
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/record-cli-release-ci
          if-no-files-found: error
          retention-days: 7

  video-windows:
    needs: package
    runs-on: windows-latest

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.package.outputs.tested_revision }}

      - name: Verify tested revision
        shell: pwsh
        env:
          TESTED_REVISION: ${{ needs.package.outputs.tested_revision }}
        run: |
          if (-not $env:TESTED_REVISION -or (git rev-parse HEAD) -ne $env:TESTED_REVISION) {
            throw 'Windows checkout does not match the Linux-tested revision'
          }

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Install source test dependencies
        run: pnpm install --frozen-lockfile

      - name: Download same-run Linux skill assets
        uses: actions/download-artifact@v4
        with:
          name: skills
          path: dist

      - name: Accept video source and actual Linux zip
        shell: pwsh
        run: bun run accept:video-windows -- --artifact (Join-Path $PWD 'dist/video-understanding.zip')

  publish:
    needs: [package, video-windows, native-build]
    if: ${{ needs.native-build.result == 'success' && needs.package.result == 'success' && needs.video-windows.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.accept_release_id == '' && inputs.accept_revision == '')) }}
    runs-on: ubuntu-latest
    concurrency:
      group: publish-skills
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - run: pnpm install --frozen-lockfile

      - name: Download same-run formal Linux build
        uses: actions/download-artifact@v4
        with:
          name: native-release-linux
          path: evidence/linux
      - name: Download same-run formal Windows build
        uses: actions/download-artifact@v4
        with:
          name: native-release-windows
          path: evidence/windows
      - name: Compare same-run platform input evidence
        run: |
          node --input-type=module -e 'import { readFile } from "node:fs/promises"; import { compareReleaseEvidence } from "./scripts/lib/record-native/ci-release-evidence.ts"; compareReleaseEvidence(JSON.parse(await readFile("evidence/linux/comparison.json", "utf8")), JSON.parse(await readFile("evidence/windows/comparison.json", "utf8")))'
      - name: Recover verified published runtime when available
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/lib/record-native/ci-release-download.ts
      - name: Prepare and assemble exact formal snapshot
        env:
          REUSE: ${{ steps.reuse.outputs.reuse }}
          BUILD_REVISION: ${{ steps.reuse.outputs.revision }}
          REUSE_RECOVERY: ${{ steps.reuse.outputs.recovery }}
        run: |
          set -euo pipefail
          runtime_version=$(node --input-type=module -e 'import { captureNativeCandidateSnapshot, nativeRuntimeVersion } from "./scripts/lib/record-native/capture.ts"; console.log(nativeRuntimeVersion((await captureNativeCandidateSnapshot(process.cwd())).source))')
          node scripts/build/native-record-candidate.ts --formal "$runtime_version" "$PWD/node_modules" "$PWD/release-stage.txt"
          stage=$(cat release-stage.txt)
          linux="$PWD/evidence/linux"
          windows="$PWD/evidence/windows"
          build_revision="$GITHUB_SHA"
          if [ "$REUSE" = true ]; then
            linux="$PWD/dist/record-cli-reused-release/x86_64-unknown-linux-gnu"
            windows="$PWD/dist/record-cli-reused-release/x86_64-pc-windows-msvc"
            build_revision="$BUILD_REVISION"
          fi
          args=(--formal "$stage" "$linux" "$windows" "$runtime_version" "$build_revision")
          if [ "$REUSE_RECOVERY" = true ]; then
            args+=("$PWD/dist/record-cli-reused-release/recovery.zip")
          fi
          node "$stage/delivery/scripts/build/assemble-native-candidate.ts" "${args[@]}"

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_HASH: ${{ needs.package.outputs.skill_hash }}
        run: node scripts/publish-native-skills.ts rolling "$PWD/release-stage.txt"

      - name: Publish immutable snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_snapshot }}
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_HASH: ${{ needs.package.outputs.skill_hash }}
        run: node scripts/publish-native-skills.ts snapshot "$PWD/release-stage.txt"

  accept-online:
    needs: [package, native-build, video-windows]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.accept_release_id != '' && inputs.accept_revision != '' && needs.package.result == 'success' && needs.native-build.result == 'success' && needs.video-windows.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve source bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.package.outputs.tested_revision }}
          fetch-depth: 0
      - name: Verify acceptance harness revision
        shell: bash
        env:
          TESTED_REVISION: ${{ needs.package.outputs.tested_revision }}
        run: |
          test -n "$TESTED_REVISION" && test "$(git rev-parse HEAD)" = "$TESTED_REVISION"
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - run: pnpm install --frozen-lockfile
      - name: Accept exact published release in isolated directories
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          ACCEPT_RELEASE_ID: ${{ inputs.accept_release_id }}
          ACCEPT_REVISION: ${{ inputs.accept_revision }}
        run: node scripts/lib/record-native/ci-release-online.ts "$ACCEPT_RELEASE_ID" "$ACCEPT_REVISION"
        shell: bash
