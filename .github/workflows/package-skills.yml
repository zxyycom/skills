name: Package Skills

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      publish_snapshot:
        description: On main, create an immutable snapshot for the current package hash
        required: false
        default: false
        type: boolean

concurrency:
  group: package-skills-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      skill_hash: ${{ steps.skill_hash.outputs.current_hash }}
      skill_packages_changed: ${{ steps.release_gate.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate and package
        run: bun run check --full

      - name: Calculate skill hash and check versions
        id: skill_hash
        env:
          BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          args=(--github-output)
          if [ -n "${BASELINE_REF:-}" ] && [ "$BASELINE_REF" != "0000000000000000000000000000000000000000" ]; then
            args+=(--baseline-ref "$BASELINE_REF")
          fi
          bun run hash:skills "${args[@]}"

      - name: Detect skill package changes
        id: release_gate
        env:
          BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          changed=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            changed=true
          elif [ -z "${BASELINE_REF:-}" ] || [ "$BASELINE_REF" = "0000000000000000000000000000000000000000" ]; then
            changed=true
          elif ! git diff --quiet "$BASELINE_REF" "$GITHUB_SHA" -- skills; then
            changed=true
          fi

          echo "Skill package content changed: $changed"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Upload skill assets
        uses: actions/upload-artifact@v4
        with:
          name: skills
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    if: ${{ needs.package.outputs.skill_packages_changed == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    concurrency:
      group: publish-skills
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Download skill assets
        uses: actions/download-artifact@v4
        with:
          name: skills
          path: dist

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_HASH: ${{ needs.package.outputs.skill_hash }}
        run: bun run publish:skills -- rolling

      - name: Publish immutable snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_snapshot }}
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_HASH: ${{ needs.package.outputs.skill_hash }}
        run: bun run publish:skills -- snapshot
