name: Record CLI Candidate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - name: Install test dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned Rust toolchain
        working-directory: tools/record-cli
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Record Linux environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/record-cli-evidence
          {
            echo "revision=$(git rev-parse HEAD)"
            git status --short
            uname -a
            getconf GNU_LIBC_VERSION
            findmnt -T "$PWD" -o TARGET,FSTYPE,SOURCE
            git --version
            (cd tools/record-cli && rustc -Vv && cargo -V)
          } | tee dist/record-cli-evidence/environment.txt
      - name: Rust format
        run: cargo +1.98.1 fmt --manifest-path tools/record-cli/Cargo.toml -- --check
      - name: Rust clippy
        run: cargo +1.98.1 clippy --manifest-path tools/record-cli/Cargo.toml --locked --all-targets -- -D warnings
      - name: Rust native tests
        timeout-minutes: 15
        env:
          RUST_BACKTRACE: 1
        run: cargo +1.98.1 test --manifest-path tools/record-cli/Cargo.toml --locked --all-targets -- --include-ignored --nocapture
      - name: Candidate offline delivery tests
        run: node --test tools/record-cli/delivery/delivery.test.ts
      - name: Verify project test evidence coverage
        run: bun run check:test-evidence-catalog
      - name: Build and verify real candidate install, update and rollback
        shell: bash
        run: |
          set -euo pipefail
          node tools/record-cli/delivery/verify-real.ts --build record-cli-ci 2>&1 | tee dist/record-cli-evidence/delivery.log
      - name: Upload candidate evidence and offline assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: record-cli-candidate-ubuntu-22.04
          path: |
            dist/record-cli-evidence/
            dist/record-cli-ci-a/source-files.json
            dist/record-cli-ci-a/assets/
            dist/record-cli-ci-b/source-files.json
            dist/record-cli-ci-b/assets/
          if-no-files-found: warn
          retention-days: 7
